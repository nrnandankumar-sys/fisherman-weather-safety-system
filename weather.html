    <link rel="stylesheet" href="weather.css">
</head>
<body>
    <header>
        <img src="logo.png" alt="" class="logo">
        <nav class="nav-links" id="navLinks">
            <a href="main.html">Home</a>
            <a href="weather.html">Weather</a>

    <div class="container">

    <h1>🌦 Weather Dashboard</h1>

    <!-- Search Box -->

    <div class="search-box">

        <input
        type="text"
        id="city"
        placeholder="Enter City Name">

        <button onclick="searchWeather()">
        Search
        </button>

    </div>


    <!-- Weather Cards -->

    <div class="cards">
        
        
        <div class="card">
            <h3>📍 Location</h3>
            <p id="location">--</p>
        </div>

        <div class="card">
            <h3>🌡 Temperature</h3>
            <p id="temp">--</p>
        </div>

        <div class="card">
            <h3>🌥 Weather</h3>
            <p id="weather">--</p>
        </div>

        <div class="card">
            <h3>💨 Wind Speed</h3>
            <p id="wind">--</p>
        </div>

        <div class="card">
            <h3>💧 Humidity</h3>
            <p id="humidity">--</p>
        </div>

    </div>

</div>
